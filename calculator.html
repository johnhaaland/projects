<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator project</title>
    <link rel="stylesheet" href="calculator.css">
</head>

<body>
    <div class="calculator-container">
        <input type="text" id="calculator-result" readonly>
        <div class="operator">
            <button class="clear-btn">C</button>
            <button class="plus-or-minus-btn">±</button>
            <button class="percentage-btn">%</button>
            <button class="division-btn">÷</button>
        </div>

        <div class="first-number-lists">
            <button class="calc-number-btn">7</button>
            <button class="calc-number-btn">8</button>
            <button class="calc-number-btn">9</button>
            <button class="multiplication-btn">×</button>
        </div>

        <div class="second-number-lists">
            <button class="calc-second-number-btn">4</button>
            <button class="calc-second-number-btn">5</button>
            <button class="calc-second-number-btn">6</button>
            <button class="subtraction-btn">-</button>
        </div>

        <div class="third-number-lists">
            <button class="calc-third-number-btn">1</button>
            <button class="calc-third-number-btn">2</button>
            <button class="calc-third-number-btn">3</button>
            <button class="addition-btn">+</button>
        </div>

        <div class="operators-btn">
            <button class="zero-btn">0</button>
            <button class="decimal-btn">.</button>
            <button class="equalto-btn">=</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
